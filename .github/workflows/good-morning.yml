name: goodmorning claude

on:
  schedule:
    # Scheduled ticks are NOT the primary coverage (GitHub delays/skips them
    # under load, sometimes for hours). They serve as a SAFETY NET and RELAY:
    # while one run keeps the window warm with an internal loop (~6h, see below),
    # each tick stays queued via `concurrency` and restarts the loop instantly
    # when the current one finishes (or if it ever gets interrupted).
    # Offset from minute 0 (2,7,...,57) as GitHub recommends.
    - cron: "2-59/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: good-morning
  cancel-in-progress: false

jobs:
  good-morning:
    runs-on: ubuntu-latest
    # ~6h is the max job duration: we stay just under. The loop exits at
    # 345 min and hands off to the scheduled run waiting in the queue.
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Keep the 5h window warm (check every 5 min within the same run)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TARGET_RESET_UTC: ${{ vars.TARGET_RESET_UTC }}
        run: |
          set +e  # a transient error (network/API/push) must not stop the loop
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The "every 5 minutes" cadence is guaranteed HERE with sleep, so it
          # doesn't depend on GitHub's scheduler. The script decides each iteration
          # whether to send the "goodmorning claude" (window expired) or exit (active).
          deadline=$(( $(date +%s) + 345 * 60 ))
          while :; do
            echo "::group::check $(date -u +%H:%M:%S)Z"
            python automation/good_morning.py
            # Persist state only when it changes (~once per 5h window),
            # so backup scheduled runs know when the window expires.
            if ! git diff --quiet automation/state.json; then
              cp automation/state.json /tmp/state.json
              git fetch origin main
              git reset --hard origin/main
              cp /tmp/state.json automation/state.json
              git add automation/state.json
              git commit -m "chore: update window reset state [skip ci]"
              git push
            fi
            echo "::endgroup::"
            [ "$(date +%s)" -ge "$deadline" ] && break
            sleep 300
          done
